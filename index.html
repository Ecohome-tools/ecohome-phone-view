<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ecohome Phone View - Mở bản vẽ</title>
<style>
html,body{margin:0;height:100%;font:17px/1.5 -apple-system,Roboto,sans-serif;background:#f4f4f2;color:#222}
#home{max-width:480px;margin:0 auto;padding:28px 20px}
h1{font-size:22px;margin:0 0 6px}p{margin:8px 0;color:#555}
label.btn{display:block;margin:22px 0 10px;padding:18px;background:#1f6f43;color:#fff;border-radius:12px;text-align:center;font-weight:700;font-size:18px}
input{display:none}small{color:#777}#err{color:#c00;font-weight:600}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
</style></head><body>
<div id="home">
<h1>Ecohome Phone View</h1>
<p>Mở file bản vẽ .html đã nhận từ xưởng. File được mở ngay trên máy bạn, không tải lên mạng.</p>
<label class="btn" for="f">Chọn file bản vẽ</label>
<input id="f" type="file" accept=".html,.htm,text/html">
<p id="err"></p>
<small>Mẹo: bấm Chia sẻ trong Safari &gt; Thêm vào Màn hình chính để mở nhanh lần sau.</small>
</div>
<iframe id="v" allow="fullscreen" sandbox="allow-scripts allow-same-origin allow-modals allow-popups allow-downloads"></iframe>
<script>
document.getElementById('f').addEventListener('change',function(e){
  var file=e.target.files&&e.target.files[0],err=document.getElementById('err');err.textContent='';
  if(!file)return;
  var r=new FileReader();
  r.onerror=function(){err.textContent='Không đọc được file. Hãy thử chọn lại.'};
  r.onload=function(){
    var fr=document.getElementById('v');fr.style.display='block';document.getElementById('home').style.display='none';
    fr.srcdoc=r.result;
  };
  r.readAsText(file,'utf-8');
});
</script></body></html>
